# Runs the reader every 10 minutes and commits the record, then the backup cranker. The reader only reads from the
# public endpoints and holds no key; the cranker step holds CRANK_KEY. Rules for when it fails are in DESIGN.md.


name: read
on:
  schedule:
    # Every 10 minutes, but off the round minutes (:00, :10, ...): GitHub's scheduler is "best effort", delays or
    # drops runs when it is busy, and is busiest at the top of the hour. The reader catches up from its last epoch.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch: # also startable by hand from the Actions tab
    inputs:
      test_slack:
        description: 'post one marked test line to Slack before reading'
        type: boolean
        default: false
      skip_crank:
        description: 'skip the transaction-sending cranker for a manual reader check'
        type: boolean
        default: false

permissions:
  contents: write # to commit the record

concurrency:
  group: read # never two readers at once: they would write the same epochs twice
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # two networks; butterfly took about 5 minutes per 720 epochs on 2026-09-18
    steps:
      # ref: main, not the commit that triggered the run: a run that waited in the concurrency queue must start from the
      # previous run's push, or its own push is refused (seen 2026-09-28 00:30 UTC, two runs started at the same moment).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ inputs.test_slack }}
        run: node bin/slack-test.js
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      # SLACK_WEBHOOK (a repository secret, optional): the reader posts one Slack message per run that found something
      # new. Without the secret nothing is sent. Butterflynet opts out in its config.
      - run: node bin/reader.js config/calibnet.json
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      # Mainnet: the contracts are deployed (2026-09-22); the upgrade date is not confirmed. Reads only the endpoint.
      - run: node bin/reader.js config/mainnet.json
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
      # Butterflynet gamma (the nv29 test network) was read here until 2026-10-15; its endpoint no longer resolves.
      # Its record stays in site/data/butterfly-gamma and on the page.
      # Backup cranker (bin/crank.js): sends submitShares / quarterlyGateCheck on calibnet when a call has been
      # possible for 30 minutes and is still missing. Needs the repository secret CRANK_KEY (a calibnet account
      # with tFIL, used for nothing else); without it the step is a dry run. Its state file lands in the commit below.
      - if: ${{ !inputs.skip_crank }}
        run: node bin/crank.js config/calibnet.json
        env:
          CRANK_KEY: ${{ secrets.CRANK_KEY }}
        continue-on-error: true
      # Daily Claim keeper (bin/claim.js): once a day, Claim for every wallet f02 owes something to. Needs the
      # repository secret CLAIM_KEY (an f1 calibnet account with tFIL, used for nothing else); without it, a dry run.
      - run: node bin/claim.js config/calibnet.json
        env:
          CLAIM_KEY: ${{ secrets.CLAIM_KEY }}
        continue-on-error: true
      # The same two steps on mainnet, with their own keys (real FIL): CRANK_KEY_MAINNET and CLAIM_KEY_MAINNET.
      # Without the secrets they are dry runs. The mainnet delay is one day (config crankDelayEpochs).
      - run: node bin/crank.js config/mainnet.json
        env:
          CRANK_KEY: ${{ secrets.CRANK_KEY_MAINNET }}
        continue-on-error: true
      - run: node bin/claim.js config/mainnet.json
        env:
          CLAIM_KEY: ${{ secrets.CLAIM_KEY_MAINNET }}
        continue-on-error: true
      - name: Commit the record if it changed
        run: |
          git config user.name "watchtower reader"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/calibnet site/data/mainnet
          git diff --cached --quiet || git commit -m "record: $(jq -r .lastEpoch site/data/calibnet/status.json)"
          git push
