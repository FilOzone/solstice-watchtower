# Runs the reader every 10 minutes and commits the record, then the backup cranker and the Claim keeper. The reader
# only reads from the public endpoints and holds no key; the crank and Claim steps hold the network's sender key
# (SENDER_KEY_CALIBRATION, SENDER_KEY_MAINNET). Rules for when it fails are in DESIGN.md.
# Calibnet and mainnet are independent: every network step goes on after a failure (continue-on-error), the record is
# committed, and the last step fails the run if any network step failed, so a failure is neither hidden nor blocking.


name: read
on:
  schedule:
    # Every 10 minutes, but off the round minutes (:00, :10, ...): GitHub's scheduler is "best effort", delays or
    # drops runs when it is busy, and is busiest at the top of the hour. The reader catches up from its last epoch.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch: # also startable by hand from the Actions tab
    inputs:
      test_slack:
        description: 'post one marked test line to Slack before reading'
        type: boolean
        default: false

permissions:
  contents: write # to commit the record

concurrency:
  group: read # never two readers at once: they would write the same epochs twice
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # two networks; butterfly took about 5 minutes per 720 epochs on 2026-09-18
    steps:
      # ref: main, not the commit that triggered the run: a run that waited in the concurrency queue must start from the
      # previous run's push, or its own push is refused (seen 2026-09-28 00:30 UTC, two runs started at the same moment).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - if: ${{ inputs.test_slack }}
        run: node bin/slack-test.js
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      # SLACK_WEBHOOK (a repository secret, optional): the reader posts one Slack message per run that found something
      # new. Without the secret nothing is sent. Butterflynet opts out in its config.
      - id: read_calibnet
        run: node bin/reader.js config/calibnet.json
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
      - id: read_mainnet
        run: node bin/reader.js config/mainnet.json
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
      # Butterflynet gamma (the nv29 test network) was read here until 2026-10-15; its endpoint no longer resolves.
      # Its record stays in site/data/butterfly-gamma and on the page.
      # Backup cranker (bin/crank.js): sends submitShares / quarterlyGateCheck when a call has been possible for
      # crankDelayEpochs (30 minutes on calibnet, one day on mainnet) and is still missing. Daily Claim keeper
      # (bin/claim.js): once a day, Claim for every wallet f02 owes something to. Both send from the network's one f1
      # sender account (cfg.wallets "sender (watchtower backup)"), whose key is the repository secret
      # SENDER_KEY_CALIBRATION or SENDER_KEY_MAINNET. Without the secret, with a placeholder address in the config, or
      # while the sender has no FIL, they are dry runs. Their state files land in the commit below.
      - id: crank_calibnet
        run: node bin/crank.js config/calibnet.json
        env:
          SENDER_KEY: ${{ secrets.SENDER_KEY_CALIBRATION }}
        continue-on-error: true
      - id: claim_calibnet
        run: node bin/claim.js config/calibnet.json
        env:
          SENDER_KEY: ${{ secrets.SENDER_KEY_CALIBRATION }}
        continue-on-error: true
      - id: crank_mainnet
        run: node bin/crank.js config/mainnet.json
        env:
          SENDER_KEY: ${{ secrets.SENDER_KEY_MAINNET }}
        continue-on-error: true
      - id: claim_mainnet
        run: node bin/claim.js config/mainnet.json
        env:
          SENDER_KEY: ${{ secrets.SENDER_KEY_MAINNET }}
        continue-on-error: true
      # Sector upgrades (bin/upgrades.js, 2026-11-10): the UpgradeSectorQuality messages and what they added, from
      # Filfox's public API, into site/data/mainnet/upgrades.json. Only new messages are fetched; a failed read keeps
      # the last file.
      - id: upgrades
        run: node bin/upgrades.js config/mainnet.json
        continue-on-error: true
      - name: Commit the record if it changed
        run: |
          git config user.name "watchtower reader"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/calibnet site/data/mainnet
          git diff --cached --quiet || git commit -m "record: $(jq -r .lastEpoch site/data/calibnet/status.json)"
          git push
      # continue-on-error above keeps one network's failure from stopping the other and the commit; this step makes the
      # run end as failed anyway, so a failure shows on the Actions tab (until 2026-11, a mainnet failure did not).
      - name: Fail the run if a network step failed
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: >-
            read_calibnet=${{ steps.read_calibnet.outcome }} read_mainnet=${{ steps.read_mainnet.outcome }}
            crank_calibnet=${{ steps.crank_calibnet.outcome }} claim_calibnet=${{ steps.claim_calibnet.outcome }}
            crank_mainnet=${{ steps.crank_mainnet.outcome }} claim_mainnet=${{ steps.claim_mainnet.outcome }}
            upgrades=${{ steps.upgrades.outcome }}
        run: |
          echo "$OUTCOMES"
          if echo "$OUTCOMES" | grep -q '=failure'; then echo "a step failed (see above)"; exit 1; fi
