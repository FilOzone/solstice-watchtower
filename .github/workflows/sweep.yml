# ONE-TIME, delete after use (with bin/sweep.js): moves the FIL of one network's two old watchtower accounts (the f1
# Claim account, then the f410 crank account) to the new sender in the config, minus gas. Started by hand only.
# The first run should be a plan (dry_run on, the default): read its log, then run again with dry_run off.
# It uses the OLD secrets (CLAIM_KEY, CRANK_KEY, CLAIM_KEY_MAINNET, CRANK_KEY_MAINNET); delete those after the sweep.
name: sweep
on:
  workflow_dispatch:
    inputs:
      network:
        description: 'network to sweep'
        type: choice
        options: [calibnet, mainnet]
        required: true
      confirm:
        description: 'type the network name again to confirm'
        type: string
        required: true
      dry_run:
        description: 'only print what would be sent'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the confirmation
        env:
          NETWORK: ${{ inputs.network }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$NETWORK" ]; then echo "confirm is '$CONFIRM', not '$NETWORK': nothing done"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # One step per network, so a run only sees the two old keys of the network it sweeps.
      - name: Sweep calibnet
        if: ${{ inputs.network == 'calibnet' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          OLD_CLAIM_KEY: ${{ secrets.CLAIM_KEY }}
          OLD_CRANK_KEY: ${{ secrets.CRANK_KEY }}
        run: node bin/sweep.js config/calibnet.json $([ "$DRY_RUN" = false ] && echo --send)
      - name: Sweep mainnet
        if: ${{ inputs.network == 'mainnet' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          OLD_CLAIM_KEY: ${{ secrets.CLAIM_KEY_MAINNET }}
          OLD_CRANK_KEY: ${{ secrets.CRANK_KEY_MAINNET }}
        run: node bin/sweep.js config/mainnet.json $([ "$DRY_RUN" = false ] && echo --send)
